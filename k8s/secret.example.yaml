# PLANTILLA de Secret — NO subir con valores reales.
# Crear preferentemente por línea de comandos (no en el repo):
#
#   kubectl -n prestalo create secret generic prestalo-secrets \
#     --from-literal=DATABASE_URL='postgres://user:pass@postgres:5432/prestalo_db' \
#     --from-literal=PRESTALO_SECRET='<secreto-largo-aleatorio>'
#
# O gestionarlo con un operador de secretos (Sealed Secrets, Vault, etc.).
apiVersion: v1
kind: Secret
metadata:
  name: prestalo-secrets
  labels: { app: prestalo }
type: Opaque
stringData:
  DATABASE_URL: "postgres://user:pass@postgres:5432/prestalo_db"
  PRESTALO_SECRET: "cambia_este_secreto_largo"
  # ANTHROPIC_API_KEY: ""
  # SMTP_USER: ""
  # SMTP_PASS: ""
