<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Préstalo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<!-- PWA -->
<meta name="theme-color" content="#0E8F86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Préstalo">
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <img class="logo-img" src="santotomas.png" alt="Instituto Profesional Santo Tomás">
    <h1>Préstalo</h1>
    <p class="sub">Instituto Profesional Santo Tomás</p>

    <div class="seg" id="seg">
      <button class="active" data-modo="rut">RUT</button>
      <button data-modo="correo">Correo</button>
    </div>

    <div class="field">
      <label id="idLabel">RUT</label>
      <input id="ident" placeholder="11.111.111-1" autocomplete="username">
    </div>
    <div class="field">
      <label>Clave</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="field">
      <label>Verificación de seguridad</label>
      <div class="cap-row">
        <span id="capQ" class="cap-q">… =</span>
        <input id="capA" inputmode="numeric" autocomplete="off" placeholder="?">
        <button type="button" id="capNew" title="Generar otra operación">↻</button>
      </div>
    </div>
    <label class="consent"><input type="checkbox" id="consent">
      <span>Acepto el <a href="#" id="verTerminos">tratamiento de mis datos personales</a> conforme a la normativa vigente del Instituto Profesional Santo Tomás.</span></label>
    <button class="btn full" id="btnLogin">Iniciar sesión</button>
    <a href="#" id="linkRecuperar" class="link-recuperar">¿Olvidaste tu contraseña?</a>
    <div class="err" id="loginErr"></div>

    <div class="demo">
      <p>Accesos de demostración (clave: <b>prestalo</b>)</p>
      <div class="demo-grid">
        <button data-rut="11.111.111-1">🎓 Alumno</button>
        <button data-rut="22.222.222-2">🧑‍🏫 Docente</button>
        <button data-rut="33.333.333-3">📦 Pañolero</button>
        <button data-rut="44.444.444-4">🛠️ Administrador</button>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="shell">
    <aside class="side">
      <div class="side-brand">
        <div class="side-logo"><img src="santotomas.png" alt="Santo Tomás"></div>
        <div><b>Préstalo</b><small id="whoRole">—</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="side-inst"><img src="santotomas.png" alt=""><span>Instituto Santo Tomás</span></div>
        <button class="side-out" id="btnLogout">Cerrar sesión</button>
      </div>
    </aside>
    <div class="content">
      <div class="content-top">
        <span id="sedeHost" class="sede-host"></span>
        <span class="who-name" id="whoName">—</span>
      </div>
      <main class="main" id="view"></main>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script src="app.js"></script>
<!-- Asistente IA de soporte oculto a solicitud. Para reactivarlo, descomentar la línea siguiente:
<script src="asistente.js"></script> -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
